<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>宋式衣橱</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      background: #F7F2EA;
      color: #3A3732;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    html { touch-action: manipulation; }
  </style>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="title-row">
        <h1 id="look-name">宋式衣橱</h1>
      </div>
      <p class="pieces" id="poem-line"></p>
      <p class="quiet" id="poem-meta"></p>
    </header>

    <div class="stage" id="stage" role="img" aria-labelledby="look-name">
      <p class="loading" id="loading">正在展开画卷</p>
      <canvas id="figure" width="720" height="1280" hidden></canvas>
    </div>

    <div class="dock">
      <div class="row" id="parts"></div>
      <p class="quiet dye-label" id="dye-label">褙子的颜色</p>
      <div class="row swatches" id="colors"></div>
      <div class="actions">
        <button class="btn-quiet" id="btn-reset" type="button">重置</button>
        <button class="btn-quiet" id="btn-shuffle" type="button">重新抽</button>
        <button class="btn-main" id="btn-poster" type="button">做成竖图</button>
      </div>
    </div>

    <section class="result" id="result" aria-hidden="true">
      <div class="result-bar">
        <button class="btn-quiet" id="btn-back" type="button">返回修改</button>
      </div>
      <div class="result-body">
        <img id="result-img" alt="" />
      </div>
      <p class="env-note" id="env-note"></p>
      <div class="result-actions">
        <button class="btn-main" id="btn-save" type="button">保存到相册</button>
        <div class="link-row">
          <button class="btn-quiet" id="btn-note" type="button">发成笔记</button>
          <button class="btn-quiet" id="btn-comment" type="button">晒到评论区</button>
          <button class="btn-quiet" id="btn-share" type="button">分享这张图</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p class="quiet">需要开启脚本才能搭配。</p></noscript>
  <script src="./js/poems.js"></script>
  <script src="./js/platform.js"></script>
  <script src="./js/recolor.js"></script>
  <script src="./js/poster.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
